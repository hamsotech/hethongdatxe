<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - RideConnect</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">RideConnect</h1>
            <p class="login-subtitle">Đăng nhập vào hệ thống</p>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-username">Số điện thoại / Email</label>
                    <input type="text" id="login-username" class="input-control" style="width: 100%;" placeholder="Nhập tài khoản" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Mật khẩu</label>
                    <input type="password" id="login-password" class="input-control" style="width: 100%;" placeholder="Nhập mật khẩu" required>
                </div>
                <div class="form-options">
                    <label><input type="checkbox" id="login-remember"> Ghi nhớ đăng nhập</label>
                    <a href="#" class="forgot-password">Quên mật khẩu?</a>
                </div>
                <button type="submit" class="btn btn--primary" style="width: 100%; padding: 0.75rem; font-size: 1.1rem;">Đăng nhập</button>
            </form>
            <div style="text-align: center; margin-top: 1.5rem;">
                <span style="color: var(--color-text-muted); font-size: 0.875rem;">Chưa có tài khoản? <a href="/register.html" style="color: var(--color-blue); font-weight: 600;">Đăng ký ngay</a></span>
            </div>
        </div>
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
