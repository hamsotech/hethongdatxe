<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Khách hàng - RideConnect</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">RideConnect</h1>
            <p class="login-subtitle">Đăng ký tài khoản Khách hàng</p>
            
            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Họ và tên</label>
                    <input type="text" id="reg-name" class="input-control" style="width: 100%;" placeholder="Nhập họ và tên" required>
                </div>
                <div class="form-group">
                    <label for="reg-phone">Số điện thoại</label>
                    <input type="tel" id="reg-phone" class="input-control" style="width: 100%;" placeholder="Nhập số điện thoại" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Mật khẩu</label>
                    <input type="password" id="reg-password" class="input-control" style="width: 100%;" placeholder="Tạo mật khẩu" required>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Xác nhận mật khẩu</label>
                    <input type="password" id="reg-confirm" class="input-control" style="width: 100%;" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="btn btn--success" style="width: 100%; padding: 0.75rem; font-size: 1.1rem; margin-top: 1rem;">Đăng ký tài khoản</button>
            </form>
            <div style="text-align: center; margin-top: 1.5rem;">
                <span style="color: var(--color-text-muted); font-size: 0.875rem;">Đã có tài khoản? <a href="/login.html" style="color: var(--color-blue); font-weight: 600;">Đăng nhập</a></span>
            </div>
        </div>
    </div>
    <script src="/js/register.js"></script>
</body>
</html>
