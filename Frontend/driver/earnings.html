<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài xế - Thu nhập</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/driver.css">
</head>
<body>
    <div class="mobile-container" id="driver-earnings">
        <header class="header">
            <h1 style="font-size: 1.25rem;">Thu nhập của bạn</h1>
        </header>

        <div class="content-section" style="text-align: center; padding: 2rem 1rem;">
            <p style="color: var(--color-text-muted); margin-bottom: 0.5rem;">Số dư hiện tại</p>
            <h2 style="font-size: 2.5rem; color: var(--color-blue); margin-bottom: 1.5rem;">2.450.000 ₫</h2>
            <button class="btn btn--primary" id="btn-withdraw" style="width: 100%; padding: 1rem;">Yêu cầu rút tiền</button>
        </div>

        <div class="content-section">
            <h3 style="margin-bottom: 1rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.5rem;">Thống kê tuần này</h3>
            <div class="css-chart" id="earnings-chart">
                <!-- CSS Based Bar Chart -->
                <div class="css-chart__bar" style="height: 30%;"><span class="css-chart__label">T2</span></div>
                <div class="css-chart__bar" style="height: 50%;"><span class="css-chart__label">T3</span></div>
                <div class="css-chart__bar" style="height: 80%; background-color: var(--color-green);"><span class="css-chart__label">T4</span></div>
                <div class="css-chart__bar" style="height: 40%;"><span class="css-chart__label">T5</span></div>
                <div class="css-chart__bar" style="height: 90%;"><span class="css-chart__label">T6</span></div>
                <div class="css-chart__bar" style="height: 60%;"><span class="css-chart__label">T7</span></div>
                <div class="css-chart__bar" style="height: 10%;"><span class="css-chart__label">CN</span></div>
            </div>
            
            <div style="display: flex; justify-content: space-between; margin-top: 1.5rem;">
                <span style="color: var(--color-text-muted);">Tổng tuần:</span>
                <strong style="font-size: 1.25rem;">1.430.000 ₫</strong>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="bottom-nav__item">Trang chủ</a>
            <a href="trips.html" class="bottom-nav__item">Chuyến xe</a>
            <a href="earnings.html" class="bottom-nav__item bottom-nav__item--active">Thu nhập</a>
            <a href="profile.html" class="bottom-nav__item">Cá nhân</a>
        </nav>
    </div>
</body>
</html>
