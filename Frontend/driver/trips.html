<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tài xế - Chuyến xe</title>
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/driver.css">
</head>
<body>
    <div class="mobile-container" id="driver-trips">
        <header class="header">
            <h1 style="font-size: 1.25rem;">Lịch sử & Chuyến xe</h1>
        </header>

        <nav class="tabs" style="margin: 0; background: var(--color-white);">
            <button class="tabs__btn tabs__btn--active" id="tab-current">Chuyến hiện tại</button>
            <button class="tabs__btn" id="tab-history">Lịch sử</button>
        </nav>

        <div class="content-section" id="content-current">
            <div style="text-align: center; color: var(--color-text-muted); padding: 2rem 0;">
                <p>Bạn không có chuyến xe nào đang diễn ra.</p>
            </div>
        </div>

        <div class="content-section" id="content-history" style="display: none;">
            <div class="list-item">
                <div>
                    <h4 style="margin-bottom: 0.25rem;">Hôm nay, 14:30</h4>
                    <p style="font-size: 0.875rem; color: var(--color-text-muted);">Quận 1 → Quận Báo</p>
                </div>
                <div style="text-align: right;">
                    <div style="font-weight: bold; color: var(--color-green);">+85.000đ</div>
                    <span class="badge badge--success">Hoàn thành</span>
                </div>
            </div>
            <div class="list-item">
                <div>
                    <h4 style="margin-bottom: 0.25rem;">Hôm qua, 09:15</h4>
                    <p style="font-size: 0.875rem; color: var(--color-text-muted);">Quận 3 → Sân bay</p>
                </div>
                <div style="text-align: right;">
                    <div style="font-weight: bold; color: var(--color-green);">+150.000đ</div>
                    <span class="badge badge--success">Hoàn thành</span>
                </div>
            </div>
            <div class="list-item">
                <div>
                    <h4 style="margin-bottom: 0.25rem;">Hôm qua, 08:00</h4>
                    <p style="font-size: 0.875rem; color: var(--color-text-muted);">Quận 5 → Quận 1</p>
                </div>
                <div style="text-align: right;">
                    <div style="font-weight: bold; color: var(--color-red);">0đ</div>
                    <span class="badge badge--danger">Khách hủy</span>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <a href="dashboard.html" class="bottom-nav__item">Trang chủ</a>
            <a href="trips.html" class="bottom-nav__item bottom-nav__item--active">Chuyến xe</a>
            <a href="earnings.html" class="bottom-nav__item">Thu nhập</a>
            <a href="profile.html" class="bottom-nav__item">Cá nhân</a>
        </nav>
    </div>
    <script>
        document.getElementById('tab-current').addEventListener('click', function() {
            this.classList.add('tabs__btn--active');
            document.getElementById('tab-history').classList.remove('tabs__btn--active');
            document.getElementById('content-current').style.display = 'block';
            document.getElementById('content-history').style.display = 'none';
        });
        document.getElementById('tab-history').addEventListener('click', function() {
            this.classList.add('tabs__btn--active');
            document.getElementById('tab-current').classList.remove('tabs__btn--active');
            document.getElementById('content-history').style.display = 'block';
            document.getElementById('content-current').style.display = 'none';
        });
    </script>
</body>
</html>
