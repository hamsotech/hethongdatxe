<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - RideConnect</title>
    <link rel="stylesheet" href="/css/common.css?v=1.1">
    <link rel="stylesheet" href="/css/login.css?v=1.1">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1 class="login-title">RideConnect</h1>
            <p class="login-subtitle">Tạo tài khoản mới</p>

            <form id="register-form">
                <div class="form-group">
                    <label for="reg-name">Họ và tên</label>
                    <input type="text" id="reg-name" class="input-control" placeholder="Nhập họ tên" required>
                </div>
                <div class="form-group">
                    <label for="reg-phone">Số điện thoại</label>
                    <input type="tel" id="reg-phone" class="input-control" placeholder="09xxxxxxxx" required>
                </div>
                <div class="form-group">
                    <label for="reg-email">Email</label>
                    <input type="email" id="reg-email" class="input-control" placeholder="email@example.com" required>
                </div>
                <div class="form-group">
                    <label for="reg-password">Mật khẩu</label>
                    <input type="password" id="reg-password" class="input-control" placeholder="Tối thiểu 6 ký tự" required>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Xác nhận mật khẩu</label>
                    <input type="password" id="reg-confirm" class="input-control" placeholder="Nhập lại mật khẩu" required>
                </div>
                <button type="submit" class="btn btn--primary" style="width:100%;padding:0.75rem;font-size:1.1rem;">
                    Đăng ký
                </button>
            </form>

            <div style="text-align:center;margin-top:1.5rem;">
                <span style="color:var(--color-text-muted);font-size:0.875rem;">
                    Đã có tài khoản?
                    <a href="/login.html" style="color:var(--color-blue);font-weight:600;">Đăng nhập</a>
                </span>
            </div>
        </div>
    </div>
    <!-- OTP Verification Modal -->
    <div id="otp-modal" class="modal-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:1000;">
        <div class="login-card" style="max-width:400px; width:90%; background:#fff; border-radius:12px; padding:2rem; box-shadow:0 10px 25px rgba(0,0,0,0.1);">
            <h2 class="login-title" style="font-size:1.5rem; margin-bottom:0.5rem;">Xác thực tài khoản</h2>
            <p class="login-subtitle" id="otp-subtitle" style="font-size:0.875rem; margin-bottom:1.5rem;">Mã xác thực OTP đã được gửi tới email của bạn.</p>
            <form id="otp-form">
                <div class="form-group" style="margin-bottom:1.5rem;">
                    <label for="otp-input" style="font-weight:600; display:block; margin-bottom:0.5rem;">Nhập mã OTP (6 số)</label>
                    <input type="text" id="otp-input" class="input-control" placeholder="123456" maxlength="6" required style="text-align:center; font-size:1.5rem; letter-spacing:0.5rem; padding:0.5rem;">
                </div>
                <div style="display:flex; gap:10px;">
                    <button type="button" id="btn-cancel-otp" class="btn btn--outline" style="flex:1; padding:0.75rem;">Hủy</button>
                    <button type="submit" class="btn btn--primary" style="flex:1; padding:0.75rem;">Xác nhận</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/register.js"></script>
</body>
</html>
